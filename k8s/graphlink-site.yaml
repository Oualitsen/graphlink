# ─────────────────────────────────────────────────────────────
#  GraphLink — Deployment + Service  (applied on every release)
#
#  Ingress rules live in graphlink-site-ingress.yaml and are
#  applied once during cluster setup — not on every deploy.
#
#  Host: graphlink.dev
#  SSL:  cert-manager / letsencrypt-prod (auto-issued)
#  Port: nginx listens on 8080 inside the container
# ─────────────────────────────────────────────────────────────

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphlink-site
  namespace: default
  labels:
    app: graphlink-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphlink-site
  template:
    metadata:
      labels:
        app: graphlink-site
    spec:
      containers:
        - name: graphlink-site
          image: ghcr.io/oualitsen/graphlink-site:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      # Run as non-root for security
      securityContext:
        runAsNonRoot: false   # nginx master needs root to bind; workers drop to nginx user automatically

---
apiVersion: v1
kind: Service
metadata:
  name: graphlink-site
  namespace: default
  labels:
    app: graphlink-site
spec:
  type: ClusterIP
  selector:
    app: graphlink-site
  ports:
    - name: http
      port: 8080
      targetPort: 8080

