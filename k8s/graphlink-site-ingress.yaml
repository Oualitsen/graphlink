# ─────────────────────────────────────────────────────────────
#  GraphLink — Ingress rules (one-time setup, not touched on every deploy)
#
#  Apply once:  kubectl apply -f k8s/graphlink-site-ingress.yaml
# ─────────────────────────────────────────────────────────────

---
# Main ingress — graphlink.dev
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphlink-site-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - graphlink.dev
      secretName: graphlink-site-tls
  rules:
    - host: graphlink.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphlink-site
                port:
                  number: 8080

---
# www redirect — 301 from www.graphlink.dev → graphlink.dev
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphlink-site-www-redirect
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://graphlink.dev$request_uri"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.graphlink.dev
      secretName: graphlink-site-www-tls
  rules:
    - host: www.graphlink.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphlink-site
                port:
                  number: 8080
