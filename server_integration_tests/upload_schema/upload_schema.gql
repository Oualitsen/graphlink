directive @glUpload on SCALAR

scalar Upload @glUpload

type UploadRejected @glError {
  userId: ID!
  reason: String!
}

type Query {
  ping: Boolean!
}

type Mutation {
  uploadOneFile(userId: ID!, file: Upload!): Boolean! @glThrows(errors: [UploadRejected])
  uploadFileList(userId: ID!, files: [Upload!]!): Boolean! @glThrows(errors: [UploadRejected])
}
