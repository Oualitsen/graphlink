server:
  port: 9994

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  graphql:
    websocket:
      path: /graphql
    path: /graphql

management:
  server:
    port: 9992
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: shutdown
