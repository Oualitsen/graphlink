site_name: GraphLink Docs
site_url: https://graphlink.dev
site_description: Typed GraphQL and REST client generation for Dart, Flutter, Java, TypeScript, Kotlin, Swift, Python and Go, plus Spring Boot and Express servers.
site_author: GraphLink
repo_url: https://github.com/Oualitsen/graphlink
repo_name: Oualitsen/graphlink

docs_dir: docs-src
exclude_docs: |
  _llms_*.txt
site_dir: dist

use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: black
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_date_format: long
      post_readtime: true
      post_excerpt: optional
      draft: false
      draft_if_future_date: true
      archive: false
      categories: true
      categories_name: Topics
      categories_url_format: "topic/{slug}"
      pagination_per_page: 10
  - meta  # reads per-page meta: blocks in frontmatter for custom og:/twitter: tags

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/ba-payoff.js
  - javascripts/carousel.js

hooks:
  - hooks/generate_llms.py

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Oualitsen/graphlink

nav:
  - Overview: index.md
  - Philosophy: philosophy.md
  - Getting Started: getting-started.md
  - Supported Targets: targets.md
  - Why REST?: why-rest.md
  - Clients:
    - Dart / Flutter: dart-client.md
    - Java: java-client.md
    - TypeScript: typescript-client.md
    - Kotlin: kotlin-client.md
    - Swift: swift-client.md
    - Python: python-client.md
    - Go: go-client.md
  - Backend:
    - Spring Boot: spring-server.md
    - Express / Apollo: express-apollo.md
  - Features:
    - Custom Queries & Mutations: custom-queries.md
    - Caching: caching.md
    - Persisted Queries: persisted-queries.md
    - REST Operations: rest-client.md
  - Reference:
    - Directives: directives.md
    - "@glSkipOnServer & @glSkipOnClient": skip-directives.md
    - Configuration: configuration.md
  - AI Agents: ai-agents.md
  - Blog: blog/index.md
