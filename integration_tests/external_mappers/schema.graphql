type Query { user(id: ID!): User }

type AddressEntity @glExternal(glClass: "AddressEntity", glImport: "com.acme.persistence.AddressEntity") @glMapsTo(type: "Address") {
  street: String!
}

type Address @glMapsTo(type: "AddressEntity") {
  street: String!
}

type UserEntity @glExternal(glClass: "UserEntity", glImport: "com.acme.persistence.UserEntity") @glMapsTo(type: "User") {
  id: ID!
  nick: String
  addresses: [AddressEntity!]!
}

type User @glMapsTo(type: "UserEntity") {
  id: ID!
  nick: String!
  addresses: [Address!]!
}
