# ─────────────────────────────────────────────────────────────────────────────
# GraphLink client integration test schema
#
# Purpose: exercise every client-side runtime concern in a single generated
# client.  Tests run against a mock adapter — no server required.
#
# Sections:
#   1. Directives
#   2. Upload scalar
#   3. Enums
#   4. Scalar container type
#   5. Nested / relationship types
#   6. Input types
#   7. Queries  — plain
#   8. Queries  — cached
#   9. Queries  — error capture
#  10. Mutations — plain
#  11. Mutations — cache invalidation
#  12. Mutations — error capture
#  13. Mutations — upload
#  14. Subscriptions
#  15. Custom operations (multi-resolver, alias, projection, union)
# ─────────────────────────────────────────────────────────────────────────────


# ── 1. Directives ─────────────────────────────────────────────────────────────

directive @glCache(
  ttl: String!
  tags: [String!]
  staleIfOffline: Boolean
) on QUERY | MUTATION | FIELD | FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | SCHEMA

directive @glCacheInvalidate(
  tags: [String!]
  all: Boolean
) on QUERY | MUTATION | FIELD | FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | SCHEMA

directive @glCaptureErrors on FIELD_DEFINITION

directive @glEqualsHashcode(fields: [String!]!) on OBJECT | INPUT_OBJECT

directive @glSkipOnClient on OBJECT | INPUT_OBJECT | SCALAR | FIELD_DEFINITION

directive @glUpload on SCALAR


# ── 2. Upload scalar ──────────────────────────────────────────────────────────

# File upload — @glUpload marks this scalar so mutations accepting it
# receive a GLUpload argument and go through the multipart adapter.
scalar Upload @glUpload


# ── 3. Enums ──────────────────────────────────────────────────────────────────

# Used to test identifier normalization: values use non-canonical casing for
# every target language (lowerCamelCase for Dart, SCREAMING_SNAKE for Java/Kotlin,
# PascalCase for TypeScript). Wire names stay as declared here.
enum EventType {
  pending
  in_progress
  completed_ok
}

# Used to test enum serialization in both query args and response fields.
enum UserStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
}

# A second enum to test multi-enum inputs and responses.
enum Priority {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum Role {
  ADMIN
  USER
  GUEST
}

# ── Enum spellings and list shapes ───────────────────────────────────────────

enum Spelling {
  A
  B2
  x__y
  http2_ok
  v1
  snake_case_2
}

enum OnlyOne {
  ONLY
}

enum ArgOnly {
  P1
  P2
}

enum RespOnly {
  R1
  R2
}

enum Phase {
  OPEN
  CLOSED
}

type PhaseProbe {
  single: Phase!
  maybe: Phase
  list: [Phase!]!
  nullableList: [Phase]
}

type Phased {
  phase: Phase!
}

type Plain {
  id: ID!
}

union PhaseHolder = Phased | Plain

