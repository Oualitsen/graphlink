  Type: String!
  Protocol: String!
  async: String!
  await: String!
  package: String!
  interface: String!
  enum: String!
  null: String!
}

input ReservedInput {
  type: String!
  default: String!
  in: String!
  is: String!
  var: String!
  val: String!
  fun: String!
  new: String!
  import: String!
  return: String!
  object: String!
  from: String!
  None: String!
  True: String!
  func: String!
  range: String!
  self: String!
  Self: String!
  init: String!
  Type: String!
  Protocol: String!
  async: String!
  await: String!
  package: String!
  interface: String!
  enum: String!
