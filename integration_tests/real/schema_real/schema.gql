}

type Error {
  id: ID!
}

type Response {
  id: ID!
}

type Request {
  id: ID!
}

type List {
  id: ID!
}

type Map {
  id: ID!
}

type Object {
  id: ID!
}

type Optional {
  id: ID!
}

type Date {
  id: ID!
}

type Result {
  id: ID!
}

type Void {
  id: ID!
}

type Clashes {
  error: Error!
  response: Response!
  request: Request!
  list: List!
  map: Map!
  object: Object!
  optional: Optional!
  date: Date!
  result: Result!
