type Odd {
  user_id: String!
  userId: String!
  URLValue: String!
  HTTPServer: String!
  _leading: String!
  trailing_: String!
  v2_name: String!
  isActive: String!
  active: String!
  getX: String!
  x: String!
}

input OddInput {
  user_id: String!
  userId: String!
  URLValue: String!
  HTTPServer: String!
  _leading: String!
  trailing_: String!
  v2_name: String!
  isActive: String!
  active: String!
  getX: String!
  x: String!
}

type ListShapes {
  a: [Int!]!
  b: [Int!]
  c: [Int]!
  d: [Int]
  e: [[Int!]!]!
  f: [[Int]]
  g: [Spelling]!
  h: [Photo]!
  i: [Attachment]!
  j: [Entity]!
}

type ListsEcho {
  a: [Int!]!
  b: [Int]
  c: [[Int!]!]
  e: [Spelling!]!
  f: [Spelling]
  g: [Spelling!]
  one: OnlyOne!
}

input ListsInput {
  a: [Int!]!
  b: [Int]
  c: [[Int!]!]
  e: [Spelling!]!
  f: [Spelling]
  g: [Spelling!] = [A, B2]
  one: OnlyOne = ONLY
}


# ── 3. Scalar container ───────────────────────────────────────────────────────

# One type that holds every scalar in both non-nullable and nullable form.
# Tests that each scalar is correctly deserialized from JSON.
type AllScalars {
  id:           ID!
  strVal:       String!
  intVal:       Int!
  floatVal:     Float!
  boolVal:      Boolean!
  nullableStr:  String
  nullableInt:  Int
  nullableFloat: Float
  nullableBool: Boolean
  nullableId:   ID
}


# ── 4. Nested / relationship types ────────────────────────────────────────────

# Leaf nested type — tests nested object deserialization.
type Address {
  street:  String!
  city:    String!
  country: String!
  zip:     String
}

# Type with a required nested object and a nullable nested object.
# Also tests enum field, list of scalars, and @glEqualsHashcode.
type User @glEqualsHashcode(fields: ["id"]) {
  id:              ID!
  name:            String!
  email:           String!
  status:          UserStatus!
  priority:        Priority
  address:         Address!
  billingAddress:  Address
  tags:            [String!]!
  scores:          [Int!]
  posts:           [Post!]
}

# Type that references User — tests multi-level nesting.
type Post {
  id:        ID!
  title:     String!
  body:      String!
  author:    User!
  coAuthor:  User
  viewCount: Int!
}

# Used in list-of-objects tests.
type Tag {
  id:    ID!
  label: String!
  color: String
}

# server-only field excluded from client — tests @glSkipOnClient
type AuditEntry {
  id:           ID!
  action:       String!
  performedBy:  String!
  internalNote: String! @glSkipOnClient
}


# ── 5. Union / interface ───────────────────────────────────────────────────────

# Used for custom-query union dispatch tests.
interface SearchResult {
  id: ID!
}

type UserResult implements SearchResult {
  id:   ID!
  name: String!
  email: String!
}

type PostResult implements SearchResult {
  id:    ID!
  title: String!
}

type DefaultsEcho {
  name:      String!
  role:      Role!
  age:       Int!
  isActive:  Boolean!
  score:     Float!
  nickname:  String!
  tags:      [String]!
}

type NestedDefaultsEcho {
  name:     String!
  address:  Address
  contacts: [Address]
  matrix:   [[Address]]
}

# Type with field-level arguments — tests that the client sends default values
# for field arguments.  The server schema has NO defaults on these fields;
# the client applies them before sending.
type Driver {
  id: ID!
  lastUsedMillage(odometerKm: Int!): Int!
  lastUsedFuel(liters: Int! = 4): Int!
}

# ── Polymorphism coverage ─────────────────────────────────────────────────────

union Attachment = Photo | Video | Document

type Photo    { id: ID! url: String! width: Int! }
type Video    { id: ID! url: String! seconds: Int! }
type Document { id: ID! url: String! pages: Int! }

# Members that give the same field different types, and types that belong to two unions.
type Phone  { id: ID! size: Int! model: String! }
type Laptop { id: ID! size: String! cpu: String! }
union Gadget = Phone | Laptop
union Shareable = Photo | Phone

interface Listing {
  id:      ID!
  title:   String!
  items(limit: Int!): [Attachment!]!
  related: Listing
}

type Album implements Listing {
  id:      ID!
  title:   String!
  items(limit: Int!): [Attachment!]!
  related: Listing
  year:    Int!
}

type Playlist implements Listing {
  id:      ID!
  title:   String!
  items(limit: Int!): [Attachment!]!
  related: Listing
  tracks:  Int!
}

union Solo = Album

interface Node { id: ID! }
interface Entity implements Node { id: ID! createdBy: String! }

type Article implements Entity & Node {
  id:          ID!
  createdBy:   String!
  title:       String!
  cover:       Attachment
  attachments: [Attachment!]!
  related:     [Entity]
}

type Comment implements Entity & Node {
  id:        ID!
  createdBy: String!
  text:      String!
  parent:    Entity
}

# ── Identifier normalization coverage ─────────────────────────────────────────
# Fields deliberately use non-canonical casing (PascalCase, snake_case,
# SCREAMING_SNAKE) so that normalization is exercised end-to-end.  Wire names
# stay as declared here; every target language maps them to its canonical form
# (e.g. `FirstName` → `firstName` in Dart/Java/Kotlin/TypeScript).
type NormalizedFields {
  id:         ID!
  FirstName:  String!
  last_name:  String!
  USER_AGE:   Int!
  event_type: EventType!
}

input NormalizedInput {
  FirstName:  String!
  last_name:  String!
  event_type: EventType!
}

# Keyword-collision coverage. `class` is reserved in Dart, Java, Kotlin, and TS
# (parameter position). Used as a type field, an input field, a top-level query
# argument, and a query operation name. The wire name stays `class`; only
# generated identifiers are sanitized (e.g. `class_`).
type ClassResult {
  id:    ID!
  class: String!
}

input ClassInput {
  class: String!
}

# ── 6. Input types ────────────────────────────────────────────────────────────

input AddressInput {
  street:  String!
  city:    String!
  country: String!
  zip:     String
}

# Comprehensive input: all scalar types, enum, nested input, list, nullable fields.
input CreateUserInput {
  name:           String!
  email:          String!
  status:         UserStatus!
  priority:       Priority
  address:        AddressInput!
  billingAddress: AddressInput
  tags:           [String!]
  initialScore:   Int
}

input UpdateUserInput {
  name:     String
  email:    String
  status:   UserStatus
  priority: Priority
  tags:     [String!]
}

input CreateWithDefaultsInput {
  name:     String!
  role:     Role        = USER
  age:      Int         = 18
  isActive: Boolean     = true
  score:    Float       = 4.5
  nickname: String      = "anonymous"
  tags:     [String]    = ["dart", "graphql"]
}

input NestedDefaultsInput {
  name:     String!
  address:  AddressInput  = {street: "123 Main St", city: "Springfield", country: "US", zip: "12345"}
  contacts: [AddressInput] = [{street: "456 Oak Ave", city: "Shelbyville", country: "US", zip: null}, {street: "789 Pine Rd", city: "Capital City", country: "US", zip: "99999"}]
  matrix:   [[AddressInput]] = [[{street: "1st St", city: "Paris", country: "FR", zip: "75000"}], [{street: "2nd St", city: "Lyon", country: "FR", zip: "69000"}]]
}


# ── 7. Queries — plain ────────────────────────────────────────────────────────

# ── @glExpand cycle test: VehicleDriver → Vehicle → VehicleOwner → VehicleDriver ──

interface Vehicle {
  id: ID!
  owner: VehicleOwner!
}

type Car implements Vehicle {
  id: ID!
  model: String!
  owner: VehicleOwner!
}

type Bike implements Vehicle {
  id: ID!
  brand: String!
  owner: VehicleOwner!
}

type VehicleOwner {
  id: ID!
  name: String!
  driver: VehicleDriver!
}

type VehicleDriver @glExpand(depth: 3) {
  id: ID!
  name: String!
  vehicle: Vehicle
}


type Query {
  # Non-nullable single object — basic case.
  getUser(id: ID!): User!

  # Nullable return — the entire response field can be null.
  findUser(id: ID!): User

  # Non-nullable list.
  listUsers: [User!]!

  # Enum argument — tests enum serialization in variables.
  listUsersByStatus(status: UserStatus!): [User!]!

  # Multiple scalar arguments.
  searchUsers(name: String!, limit: Int!): [User!]!

  # All scalar types in the response.
  getAllScalars(id: ID!): AllScalars!

  # Multi-level nested response.
  getPost(id: ID!): Post!

  # Returns a list of objects with a nullable field.
  getTags: [Tag!]!

  # Audit entry — has a @glSkipOnClient field.
  getAuditEntry(id: ID!): AuditEntry!

  # Returns an interface type — tests __typename-based dispatch in custom queries.
  search(term: String!): [SearchResult!]!


# ── 8. Queries — cached ───────────────────────────────────────────────────────

  # Basic cache with TTL and tag.
  getCachedUser(id: ID!): User! @glCache(ttl: "2m", tags: ["users"])

  # Cached list — same tag group as getCachedUser.
  listCachedUsers: [User!]! @glCache(ttl: "1m", tags: ["users"])

  # Different tag group — invalidated independently from "users".
  getCachedPost(id: ID!): Post! @glCache(ttl: "5m", tags: ["posts"])

  # No tags — cannot be tag-invalidated, only expires by TTL.
  getCachedConfig: AllScalars! @glCache(ttl: "10m")

  # staleIfOffline: return expired value when network fails.
  getStaleUser(id: ID!): User @glCache(ttl: "1s", staleIfOffline: true, tags: ["users"])


# ── 9. Queries — error capture ────────────────────────────────────────────────

  # Errors returned inline instead of thrown.
  getUserOrErrors(id: ID!): User! @glCaptureErrors

  # Nullable return + error capture.
  findUserOrErrors(id: ID!): User @glCaptureErrors

  # Default-value field arguments — client applies defaults before sending.
  listUsersWithDefaults(limit: Int = 20, role: Role = USER): [User]!

  # Driver with field-level argument defaults
  getDriver(id: ID!): Driver!

  # @glExpand cycle test
  getVehicleDriver(id: ID!): VehicleDriver!

  # Keyword operation + keyword top-level argument.
  class(class: ID!): ClassResult!

  # Normalization: fields on the return type use non-canonical casing.
  getNormalizedRecord(id: ID!): NormalizedFields!

  # Polymorphism coverage.
  feed: [Entity!]!
  node(id: ID!): Node
  attachment(id: ID!): Attachment
  attachments: [Attachment!]!
  attachmentsNullable: [Attachment]
  article(id: ID!): Article!
  getCachedAttachment(id: ID!): Attachment @glCache(ttl: "1m", tags: ["attachments"])
  getCachedNode(id: ID!): Node @glCache(ttl: "1m", tags: ["nodes"])
  attachmentOrErrors(id: ID!): Attachment @glCaptureErrors
  gadget(id: ID!): Gadget
  gadgets: [Gadget!]!
  shareable(id: ID!): Shareable
  photo(id: ID!): Photo
  listing(id: ID!): Listing
  listings: [Listing!]!
  solo: Solo
  listShapes(mode: String!): ListShapes!
  bigInts(n: Int!): [Int!]!
  bigPhotos(n: Int!): [Photo!]!
  echoArgs(a: [Int!]!, b: [Int], c: [[Int!]!], e: [Spelling!]!, f: [Spelling], g: [Spelling!] = [A, B2], one: OnlyOne = ONLY): ListsEcho!
  echoInput(input: ListsInput!): ListsEcho!
  argOnly(v: ArgOnly!): String!
  respOnly: RespOnly!
  phaseProbe: PhaseProbe!
  phaseHolder: PhaseHolder!
  reservedEcho(type: String!, default: String!, in: String!, is: String!, var: String!, val: String!, fun: String!, new: String!, import: String!, return: String!, object: String!, from: String!, None: String!, True: String!, func: String!, range: String!, self: String!, Self: String!, init: String!, Type: String!, Protocol: String!, async: String!, await: String!, package: String!, interface: String!, enum: String!, null: String!): Reserved!
  reservedEchoInput(input: ReservedInput!): Reserved!
  literalEcho(v: Literal!, all: [Literal!]!): Literal!
  literals: [Literal!]!
  clashes: Clashes!
  oddEcho(input: OddInput!): Odd!
  import(value: String!): String!
  default(value: String!): String!
  new(value: String!): String!
  func(value: String!): String!
  None(value: String!): String!
  self(value: String!): String!
}


# ── 10. Mutations — plain ─────────────────────────────────────────────────────

type Mutation {
  # Returns the full created object.
  createUser(input: CreateUserInput!): User!

  # Returns a scalar (Boolean).
  deleteUser(id: ID!): Boolean!

  # Partial update — UpdateUserInput has mostly nullable fields.
  updateUser(id: ID!, input: UpdateUserInput!): User!


# ── 11. Mutations — cache invalidation ────────────────────────────────────────

  # Evicts all "users" cache entries.
  createCachedUser(input: CreateUserInput!): User!
    @glCacheInvalidate(tags: ["users"])

  # Evicts both "users" and "posts".
  transferPost(postId: ID!, newAuthorId: ID!): Post!
    @glCacheInvalidate(tags: ["users", "posts"])

  # Wipes the entire cache.
  resetAll: Boolean! @glCacheInvalidate(all: true)

  # Evicts the cached union results.
  evictAttachments: Boolean! @glCacheInvalidate(tags: ["attachments"])

  # Evicts the cached interface results.
  evictNodes: Boolean! @glCacheInvalidate(tags: ["nodes"])


# ── 12. Mutations — error capture ─────────────────────────────────────────────

  # Errors returned inline.
  createUserOrErrors(input: CreateUserInput!): User! @glCaptureErrors


# ── 13. Mutations — upload ────────────────────────────────────────────────────

  # Single file upload — file arg becomes GLUpload, goes through multipart adapter.
  uploadOneFile(userId: ID!, file: Upload!): Boolean!

  # List of files — files arg becomes List<GLUpload>.
  uploadFileList(userId: ID!, files: [Upload!]!): Boolean!


# ── 14. Mutations — default-value inputs ──────────────────────────────────────

  # Echoes back the received input so tests can verify the client applied defaults.
  createWithDefaults(input: CreateWithDefaultsInput!): DefaultsEcho!

  # Echoes back nested objects/lists so tests can verify client applied nested defaults.
  createWithNestedDefaults(input: NestedDefaultsInput!): NestedDefaultsEcho!

  # Keyword input field round-trip.
  makeClass(input: ClassInput!): ClassResult!

  # Normalization: input fields use non-canonical casing; echoes them back.
  createNormalizedRecord(input: NormalizedInput!): NormalizedFields!

  # Polymorphism coverage: kind is photo, video or document.
  addAttachment(articleId: ID!, url: String!, kind: String!): Attachment!
}


# ── 13. Subscriptions ─────────────────────────────────────────────────────────

type Subscription {
  # Basic subscription — typed response stream.
  userCreated: User!
  userCreateds(ids: [ID!]!): [User!]

  # Subscription with a scalar argument.
  userStatusChanged(userId: ID!): User!

  # Emits an incrementing counter every 1 s.
  counterTick: Int!

  # Polymorphism coverage: emits a Photo, a Video, then a Document.
  attachmentAdded: Attachment!

  # Polymorphism coverage: emits an Article, then a Comment.
  entityPublished: Entity!

  # Like counterTick but the server self-restarts after emitting tick stopAt.
  counterTickRestart(stopAt: Int!): Int!
}


# ── 14. Custom operations ─────────────────────────────────────────────────────

# Multi-resolver query — one round-trip, unified typed response.
query fetchUserAndPost($userId: ID!, $postId: ID!) {
  user: getUser(id: $userId) {
    ... _all_fields
  }
  post: getPost(id: $postId) {
    id
    title
    author {
      ... _all_fields
    }
  }
}

# Partial projection — only selected fields come back.
query fetchUserSummary($id: ID!) {
  getUser(id: $id) {
    id
    name
    status
  }
}

# Interface inline fragments — tests __typename dispatch and projected types.
query runSearch($term: String!) {
  search(term: $term) {
    ... on UserResult { id name email }
    ... on PostResult { id title }
  }
}

# Custom query with cache directives — each resolver cached independently.
query fetchCachedPair($userId: ID!, $postId: ID!)
    @glCache(ttl: "3m", tags: ["pair"]) {
  user: getCachedUser(id: $userId) @glCache(ttl: "2m", tags: ["users"]) {
    ... _all_fields
  }
  post: getCachedPost(id: $postId) @glCache(ttl: "5m", tags: ["posts"]) {
    ... _all_fields
  }
}
