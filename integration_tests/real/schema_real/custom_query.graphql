query findFirstUser {
  findUser(id: "user-1") { id name email status }
}

query listActiveUsers {
  listUsersByStatus(status: ACTIVE) { id name status }
}

query searchAlice {
  searchUsers(name: "Alice", limit: 5) { id name }
}

query searchWithFixedLimit($name: String!) {
  searchUsers(name: $name, limit: 1) { id name }
}

query searchPrice {
  searchUsers(name: "cost $5 or $6", limit: 1) { id name }
}

query fetchAttachment($id: ID!) {
  attachment(id: $id) {
    ... on Photo { id url width }
    ... on Video { id url seconds }
    ... on Document { id url pages }
  }
}

query fetchArticleAndAttachment($articleId: ID!, $attachmentId: ID!) {
  article(id: $articleId) { id title cover { ...AttachmentParts } }
  attachment(id: $attachmentId) { ...AttachmentParts }
}

fragment AttachmentParts on Attachment {
  ... on Photo { id width }
  ... on Video { id seconds }
  ... on Document { id pages }
}

query fetchFeed {
  feed {
    __typename id createdBy
    ... on Article { title cover { ... on Photo { id url } } attachments { ...AttachmentParts } }
    ... on Comment { text }
  }
}

query fetchNode($id: ID!) {
  node(id: $id) {
    id
    ... on Entity { createdBy }
    ... on Article { title }
  }
}

query fetchPhotoParts($id: ID!) {
  attachment(id: $id) {
    ... on Photo { ...PhotoParts }
    ... on Video { id }
  }
}

fragment PhotoParts on Photo { id url width }

query fetchGadget($id: ID!) {
  gadget(id: $id) {
    ... on Phone { id size }
    ... on Laptop { id laptopSize: size }
  }
}

query fetchGadgets {
  gadgets {
    ... on Phone { id size }
    ... on Laptop { id laptopSize: size }
  }
}

query fetchPhotoUrl($id: ID!) {
  attachment(id: $id) {
    ... on Photo { url }
    ... on Video { id }
  }
}

query fetchPhotoWidth($id: ID!) {
  photo(id: $id) { width }
}

query searchMixed($term: String!) {
  search(term: $term) {
    ... on SearchResult { id }
    ... on UserResult { name }
    ... on PostResult { title }
  }
}

query fetchNodeId($id: ID!) {
  node(id: $id) { id }
}

query nastyLiteral {
  echoNastyArgs(dollar: "cost $5 ${x}", quote: "say \"hi\"", backslash: "C:\\dir", newline: "a\nb", unicode: "\u00e9\ud83d\ude00", triple: """block "x" """) {
    dollar quote backslash newline unicode triple
  }
}

# ── Fragments ────────────────────────────────────────────────────────────────

fragment UserBasics on User { id name }

fragment UserWithStatus on User {
  ...UserBasics
  status
}

fragment EntityBits on Entity { id createdBy }

query fragNested($id: ID!) {
  getUser(id: $id) { ...UserWithStatus }
}

query fragReuseA {
  listUsers { ...UserBasics }
}

query fragReuseB($id: ID!) {
  getUser(id: $id) { ...UserBasics email }
}

query fragOnInterface {
  feed {
    ...EntityBits
    ... on Article { title }
  }
}

query multiRoot {
  first: getUser(id: "user-1") { ...UserBasics }
  second: getUser(id: "user-2") { ...UserBasics }
  all: listUsers { ...UserBasics }
}

# ── Variables ────────────────────────────────────────────────────────────────

query varsDefaults($limit: Int = 1, $name: String = "s") {
  searchUsers(name: $name, limit: $limit) { id name }
}

query varsLists($a: [Int!]!, $b: [Int], $c: [[Int!]!], $e: [Spelling!]!, $f: [Spelling]) {
  echoArgs(a: $a, b: $b, c: $c, e: $e, f: $f) { a b c e f g one }
}

query varsEnum($one: OnlyOne) {
  echoArgs(a: [], e: [], one: $one) { one }
}

query varsInput($inner: InnerInput!) {
  echoInner(inner: $inner) { n label tags }
}

query varsNullable($dollar: String, $quote: String!) {
  echoNastyArgs(dollar: $dollar, quote: $quote) { dollar quote }
}

# ── Conditional fields ───────────────────────────────────────────────────────

query conditionalVars($withEmail: Boolean!, $skipName: Boolean!) {
  getUser(id: "user-1") {
    id
    name @skip(if: $skipName)
    email @include(if: $withEmail)
  }
}

query conditionalLiterals {
  getUser(id: "user-1") {
    id
    name @include(if: true)
    email @include(if: false)
    status @skip(if: false)
    priority @skip(if: true)
  }
}

# ── Aliases ──────────────────────────────────────────────────────────────────

query aliasesSameField {
  a: getUser(id: "user-1") { id name }
  b: getUser(id: "user-2") { id name }
}

query aliasKeywords {
  class: getUser(id: "user-1") { default: name import: id }
}

query aliasEqualsOtherField {
  getUser(id: "user-1") { id name: email }
}

# ── Operation names that collide with something ──────────────────────────────

query User { getUser(id: "user-1") { id } }

query Photo { photo(id: "ph1") { id } }

query return { listUsers { id } }

query shelf { shelf { id } }

query getUserResponse { getUser(id: "user-1") { id } }

# ── Nested field arguments ───────────────────────────────────────────────────

query shelfItems {
  shelf {
    id
    items(tags: ["a", "b"], kind: x__y, filter: {n: 3, label: "L"}, limit: 5)
  }
}

query shelfItemsVars($tags: [String!], $kind: Spelling, $filter: InnerInput, $limit: Int) {
  shelf {
    items(tags: $tags, kind: $kind, filter: $filter, limit: $limit)
  }
}

query shelfItemsDefaults {
  shelf { items }
}

# ── Literal arguments of every kind ──────────────────────────────────────────

query literalLists {
  echoArgs(a: [1, 2, 3], b: [1, null], c: [[1], [2, 3]], e: [A, x__y], f: [null, v1], g: [snake_case_2], one: ONLY) {
    a b c e f g one
  }
}

query literalInput {
  echoInput(input: {a: [4], b: [null, 5], c: [[6]], e: [B2], f: [null], g: [A], one: ONLY}) {
    a b c e f g one
  }
}

query literalScalars {
  echoEverything(input: {i: 5, neg: -3, big: 9, f: 2.5, exp: 1e2, b: false, bf: true, s: "lit", id: "q", e: v1, ints: [9], nested: [[1]], inner: {n: 2, label: "L"}, nothing: null, emptyList: [], emptyObj: {}}) {
    i neg big f exp b bf s id e ints nested nothing emptyList
    inner { n label tags }
    emptyObj { n label tags }
  }
}

query literalsMixed($a: [Int!]!, $one: OnlyOne) {
  echoArgs(a: $a, e: [A, B2], f: [v1], one: $one) { a e f one }
}

# ── __typename under an alias, and one field selected two ways ───────────────

query kindAlias {
  attachments {
    kind: __typename
    ... on Photo { id width }
    ... on Video { id seconds }
    ... on Document { id pages }
  }
}

query twoViews($a: ID!, $b: ID!) {
  first: attachment(id: $a) {
    ... on Photo { width }
    ... on Video { seconds }
    ... on Document { pages }
  }
  second: attachment(id: $b) {
    ... on Photo { url }
    ... on Video { url }
    ... on Document { id }
  }
  photoWidth: photo(id: "ph1") { width }
  photoUrl: photo(id: "ph1") { url }
}

# ── Recursion, nested lists and scalars inside polymorphic types ─────────────

query chainDeep($id: ID!) {
  chain(id: $id) {
    ... on Link {
      id
      next {
        ... on Link { id next { ... on Link { id } ... on End { id reason } } }
        ... on End { id reason }
      }
    }
    ... on End { id reason }
  }
}

query gridProjected($empty: Boolean) {
  grid(empty: $empty) {
    cells { ... on Photo { id width } ... on Video { id seconds } }
    rows { id ... on Article { title } ... on Comment { text } }
    maybe { ... on Photo { url } ... on Document { id } }
  }
}

query momentsProjected {
  moments {
    ... on Stamp { id at big }
    ... on Span { id at until opaque dts }
  }
}

query timedProjected {
  timed {
    id
    at
    ... on Stamp { big }
    ... on Span { opaque }
  }
}
