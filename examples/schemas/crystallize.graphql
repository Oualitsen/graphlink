type Query {
  grid(
    id: ID!
    language: String
  ): Grid
  image(
    key: String!
    language: String!
  ): Image
  images(
    language: String!
    first: Int = 20
    after: String
    last: Int
    before: String
    filter: ImageFilterInput
  ): ImageConnection!
  catalogue(
    path: String = "/"
    language: String
    version: VersionLabel = published
    pathResolutionMethods: [PathResolutionMethodArgs] = [canonical]
  ): Item
  tree(
    path: String = "/"
    language: String
  ): [Item]  @deprecated(reason: "`tree` query is deprecated and will be removed in a future release. Use the `catalogue` query instead.")
  """**EXPERIMENTAL:** Watch out! This feature is still in testing process."""
  priceList(identifier: String!): PriceList
  tenant(language: String): Tenant
  topic(
    path: String!
    language: String!
  ): Topic
  topics(
    name: String
    ancestry: [String!]
    language: String
  ): [Topic!]!
  version: VersionInfo
  productVariants(
    skus: [String!]!
    language: String!
    versionLabel: VersionLabel = published
  ): [ProductVariant]!
  _service: _Service!
}

enum SortDirection {
  asc
