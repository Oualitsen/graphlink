directive @glUpload on SCALAR
directive @glSkipOnServer(mapTo: String, batch: Boolean! = true) on FIELD_DEFINITION|OBJECT|SCALAR
directive @glServerLenient on OBJECT | INTERFACE
directive @glReturnsProjection on FIELD_DEFINITION

#scalar Upload @glUpload @glSkipOnServer

type Person {
    id: ID!
    name: String!
    age: Int!
    car: Car @glSkipOnServer(batch: false)
    car2: MyCouple @glSkipOnServer(batch: false)
}

type MyCouple @glSkipOnServer(mapTo: "Car"){
    car: Car
    age: Int
}

type Car  {
    id: ID!
    brand: String
    model: String!
    owner: Person!
}

input CreatePersonInput {
    name: String!
    age: Int!
}

input CreateCarInput {
    brand: String!
    model: String!
    ownerId: ID!
}

type Query {
    person(id: ID!): Person @glValidate
    car(id: ID!): Car
    carList: [Car] @glReturnsProjection
    getMyCouple: MyCouple

    getBase: Base
}

interface Base {
    id: ID!
    name: String
}

type Cat implements Base {
    id: ID!
    name: String
    fur: String
}

type Dog implements Base {
    id: ID!
    name: String
    bark: String
}

type Mutation {
    createPerson(input: CreatePersonInput!): Person!
    createCar(input: CreateCarInput!): Car!

  #  uploadFile(file: Upload!): Int!
}

type Subscription {
    watchCars: [Car!]! @glReturnsProjection
}

