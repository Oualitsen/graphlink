type Query {
  enterprise: Enterprise!
}

type Enterprise {
  team: EnterpriseTeam!
  organization: Organization!
}

# EnterpriseTeam and Organization both have a field named `repositories`
# but with different orderBy input types — this is the same-field-name collision.
type EnterpriseTeam {
  organizations(orderBy: EnterpriseTeamOrganizationOrder): [Organization!]!
  repositories(orderBy: TeamRepositoryOrder): [Repo!]!
}

type Organization {
  auditLog(orderBy: AuditLogOrder): [AuditEntry!]!
  repositories(orderBy: RepositoryOrder): [Repo!]!
  members(limit: Int): [User!]!
}

type Repo      { id: ID!  name: String! }
type AuditEntry { id: ID! action: String! }
type User      { id: ID!  login: String! }

input EnterpriseTeamOrganizationOrder { field: String! direction: String! }
input AuditLogOrder                   { field: String! direction: String! }
input RepositoryOrder                 { field: String! direction: String! }
input TeamRepositoryOrder             { field: String! direction: String! }
