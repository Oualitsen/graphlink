name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test

  # Generate every integration_tests client exactly once, then hand the result
  # to the client jobs below via artifact. Runs in parallel with every other
  # top-level job (no `needs` on anything).
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make clean-all generate-all
      - uses: actions/upload-artifact@v4
        with:
          name: integration-tests-generated
          retention-days: 1
          path: integration_tests

  dart-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/dart_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  dart-rest-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/dart_rest_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  typescript-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/typescript_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make install
      - run: make ci-no-generate

  java-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/java_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  kotlin-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/kotlin_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  # Runs on macos-latest, not ubuntu-latest like every other client here:
  # generated code uses URLSessionWebSocketTask, whose Linux implementation
  # (swift-corelibs-foundation's FoundationNetworking) has real API gaps
  # vs Darwin (different completion-handler shapes, missing overloads) —
  # not worth chasing for a client whose actual target platform is
  # iOS/macOS anyway. Xcode ships its own Swift toolchain, so no
  # swift-actions/setup-swift step is needed here.
  swift-client:
    runs-on: macos-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/swift_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  # Generate every server_integration_tests client/server exactly once, then hand
  # the result to the matrix + upload jobs below via artifact. Runs in parallel
  # with every other top-level job (no `needs` on anything).
  server-integration-tests-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make clean-all generate-all
      - uses: actions/upload-artifact@v4
        with:
          name: server-integration-tests-generated
          retention-days: 1
          path: server_integration_tests

  # Full client x server matrix: each generated server target driven by each
  # generated client harness. 5 servers x 7 clients = 35 independent jobs, each
  # its own pass/fail check. swift is deliberately NOT in this matrix — see
  # swift-vs-java-matrix-client below, which runs it against java only to keep
  # this matrix from growing 5x for a single extra client.
  matrix:
    runs-on: ubuntu-latest
    needs: server-integration-tests-generate
    strategy:
      fail-fast: false
      matrix:
        server: [typescript, kotlin-blocking, kotlin-suspend, java, java-reactive]
        client: [dart, ts, java, kotlin, java_reactive, python, go]
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/download-artifact@v4
        with:
          name: server-integration-tests-generated
          path: server_integration_tests
      - name: Run ${{ matrix.client }} client against ${{ matrix.server }} server
        run: |
          case "${{ matrix.server }}" in
            typescript)       make ci-typescript-client CLIENT=${{ matrix.client }} ;;
            kotlin-blocking)  make ci-kotlin-blocking-client CLIENT=${{ matrix.client }} ;;
            kotlin-suspend)   make ci-kotlin-suspend-client CLIENT=${{ matrix.client }} ;;
            java)             make ci-java-client CLIENT=${{ matrix.client }} ;;
            java-reactive)    make ci-java-reactive-client CLIENT=${{ matrix.client }} ;;
          esac

  # swift client x java server only — not folded into the full matrix above
  # to avoid a 5x job-count blowup for one extra client. Runs on macos-latest
  # (see swift-client job above for why: Linux's URLSessionWebSocketTask has
  # real API gaps vs Darwin, not worth chasing for an iOS/macOS-targeted client).
  swift-vs-java-matrix-client:
    runs-on: macos-latest
    needs: server-integration-tests-generate
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: server-integration-tests-generated
          path: server_integration_tests
      - run: make ci-java-client CLIENT=swift

  # Upload-feature suite: a dedicated dart-only harness, orthogonal to the client x server matrix above.
  integration-tests-typescript-upload:
    runs-on: ubuntu-latest
    needs: server-integration-tests-generate
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: server-integration-tests-generated
          path: server_integration_tests
      - run: make ci-upload

  build-spring-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build servers
        run: |
          cd integration_tests/real/spring_server && ./gradlew build -x test
          cd ../spring_upload_server && ./gradlew build -x test
      - uses: actions/upload-artifact@v4
        with:
          name: spring-server-jars
          retention-days: 1
          path: |
            integration_tests/real/spring_server/build/libs/*.jar
            integration_tests/real/spring_upload_server/build/libs/*.jar

  dart-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/dart_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate

  dart-rest-real:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/real/dart_rest_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  dart-rest-dio-real:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/real/dart_rest_dio_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  typescript-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/typescript_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make install
      - run: make ci-no-generate

  java-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/java_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate

  java-reactor-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/java_client_tests_reactor_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate

  kotlin-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/kotlin_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate

  # macos-latest, not ubuntu-latest — see swift-client above for why.
  swift-real:
    runs-on: macos-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/swift_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate

  python-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/python_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  python-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/python_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate

  go-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/mock/go_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  go-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/real/go_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests/real
      - run: make ci-no-generate
