name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test

  # Generate every integration_tests client exactly once, then hand the result
  # to the client jobs below via artifact. Runs in parallel with every other
  # top-level job (no `needs` on anything).
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make clean-all generate-all
      - uses: actions/upload-artifact@v4
        with:
          name: integration-tests-generated
          retention-days: 1
          path: integration_tests

  dart-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/dart_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  typescript-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/typescript_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make install
      - run: make ci-no-generate

  java-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/java_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  kotlin-client:
    runs-on: ubuntu-latest
    needs: generate
    defaults:
      run:
        working-directory: integration_tests/kotlin_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - run: make ci-no-generate

  # Generate every server_integration_tests client/server exactly once, then hand
  # the result to the matrix + upload jobs below via artifact. Runs in parallel
  # with every other top-level job (no `needs` on anything).
  server-integration-tests-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make clean-all generate-all
      - uses: actions/upload-artifact@v4
        with:
          name: server-integration-tests-generated
          retention-days: 1
          path: server_integration_tests

  # Full client x server matrix: each generated server target driven by each
  # generated client harness. 5 servers x 5 clients = 25 independent jobs, each
  # its own pass/fail check.
  matrix:
    runs-on: ubuntu-latest
    needs: server-integration-tests-generate
    strategy:
      fail-fast: false
      matrix:
        server: [typescript, kotlin-blocking, kotlin-suspend, java, java-reactive]
        client: [dart, ts, java, kotlin, java_reactive]
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: server-integration-tests-generated
          path: server_integration_tests
      - name: Run ${{ matrix.client }} client against ${{ matrix.server }} server
        run: |
          case "${{ matrix.server }}" in
            typescript)       make ci-typescript-client CLIENT=${{ matrix.client }} ;;
            kotlin-blocking)  make ci-kotlin-blocking-client CLIENT=${{ matrix.client }} ;;
            kotlin-suspend)   make ci-kotlin-suspend-client CLIENT=${{ matrix.client }} ;;
            java)             make ci-java-client CLIENT=${{ matrix.client }} ;;
            java-reactive)    make ci-java-reactive-client CLIENT=${{ matrix.client }} ;;
          esac

  # Upload-feature suite: a dedicated dart-only harness, orthogonal to the client x server matrix above.
  integration-tests-typescript-upload:
    runs-on: ubuntu-latest
    needs: server-integration-tests-generate
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: server-integration-tests-generated
          path: server_integration_tests
      - run: make ci-upload

  build-spring-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build servers
        run: |
          cd integration_tests/spring_server && ./gradlew build -x test
          cd ../spring_upload_server && ./gradlew build -x test
      - uses: actions/upload-artifact@v4
        with:
          name: spring-server-jars
          retention-days: 1
          path: |
            integration_tests/spring_server/build/libs/*.jar
            integration_tests/spring_upload_server/build/libs/*.jar

  dart-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/dart_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci-no-generate

  typescript-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/typescript_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make install
      - run: make ci-no-generate

  java-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/java_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci-no-generate

  kotlin-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, generate]
    defaults:
      run:
        working-directory: integration_tests/kotlin_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci-no-generate

