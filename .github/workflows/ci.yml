name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test

  integration-tests-dart-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/dart_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make ci

  integration-tests-typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/typescript_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: make install
      - run: make ci

  integration-tests-java-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/java_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make ci
