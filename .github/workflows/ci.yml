name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test

  integration-tests-dart-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/dart_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make ci

  integration-tests-typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/typescript_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make install
      - run: make ci

  integration-tests-java-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/java_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make ci

  integration-tests-kotlin-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/kotlin_client_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make ci

  integration-tests-typescript-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make ci

  integration-tests-kotlin-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make kotlin

  build-spring-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build servers
        run: |
          cd integration_tests/spring_server && ./gradlew build -x test
          cd ../spring_upload_server && ./gradlew build -x test
      - uses: actions/upload-artifact@v4
        with:
          name: spring-server-jars
          retention-days: 1
          path: |
            integration_tests/spring_server/build/libs/*.jar
            integration_tests/spring_upload_server/build/libs/*.jar

  integration-tests-dart-real:
    runs-on: ubuntu-latest
    needs: build-spring-servers
    defaults:
      run:
        working-directory: integration_tests/dart_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci

  integration-tests-typescript-real:
    runs-on: ubuntu-latest
    needs: build-spring-servers
    defaults:
      run:
        working-directory: integration_tests/typescript_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make install
      - run: make ci

  integration-tests-java-real:
    runs-on: ubuntu-latest
    needs: build-spring-servers
    defaults:
      run:
        working-directory: integration_tests/java_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci

  integration-tests-kotlin-real:
    runs-on: ubuntu-latest
    needs: build-spring-servers
    defaults:
      run:
        working-directory: integration_tests/kotlin_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci

  integration-tests-typescript-server-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make ci

