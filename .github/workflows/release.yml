name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: glink-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: glink-linux-arm64
          - os: windows-latest
            artifact: glink-windows-x86_64.exe
          - os: macos-13
            artifact: glink-macos-x86_64
          - os: macos-latest
            artifact: glink-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get

      - name: Compile binary
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          dart compile exe lib/src/main.dart -o ${{ matrix.artifact }} --define=version=$VERSION

      - name: Compute checksum (Linux / macOS)
        if: runner.os != 'Windows'
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Compute checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "${{ matrix.artifact }}.sha256" -Value "$hash  ${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  test-macos-x86_64:
    needs: build
    runs-on: macos-13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: glink-macos-x86_64
          path: dist
      - name: Smoke test
        run: |
          chmod +x dist/glink-macos-x86_64
          dist/glink-macos-x86_64 --help

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glink-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: glink-linux-arm64
          path: dist
      - name: Stage binaries for Docker build context
        run: |
          cp dist/glink-linux-x86_64 glink-linux-x86_64
          cp dist/glink-linux-arm64 glink-linux-arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${REF#v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            oualitsen/graphlink:${{ steps.version.outputs.tag }}
            oualitsen/graphlink:latest

  release:
    needs: [build, test-macos-x86_64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: cat dist/*.sha256 > dist/checksums.sha256

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/glink-linux-x86_64
            dist/glink-linux-arm64
            dist/glink-windows-x86_64.exe
            dist/glink-macos-x86_64
            dist/glink-macos-arm64
            dist/checksums.sha256
