name: Real-Server Integration Tests

on:
  workflow_dispatch:

jobs:
  build-spring-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build servers
        run: |
          cd integration_tests/spring_server && ./gradlew build -x test
          cd ../spring_upload_server && ./gradlew build -x test
      - uses: actions/upload-artifact@v4
        with:
          name: spring-server-jars
          retention-days: 1
          path: |
            integration_tests/spring_server/build/libs/*.jar
            integration_tests/spring_upload_server/build/libs/*.jar

  # Generate every integration_tests client exactly once, then hand the result
  # to the client jobs below via artifact. Runs in parallel with build-spring-servers.
  integration-tests-generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: make clean-all generate-all
      - uses: actions/upload-artifact@v4
        with:
          name: integration-tests-generated
          retention-days: 1
          path: integration_tests

  integration-tests-dart-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, integration-tests-generate]
    defaults:
      run:
        working-directory: integration_tests/dart_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci-no-generate

  integration-tests-typescript-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, integration-tests-generate]
    defaults:
      run:
        working-directory: integration_tests/typescript_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make install
      - run: make ci-no-generate

  integration-tests-java-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, integration-tests-generate]
    defaults:
      run:
        working-directory: integration_tests/java_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci-no-generate

  integration-tests-kotlin-real:
    runs-on: ubuntu-latest
    needs: [build-spring-servers, integration-tests-generate]
    defaults:
      run:
        working-directory: integration_tests/kotlin_client_tests_real
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: integration-tests-generated
          path: integration_tests
      - uses: actions/download-artifact@v4
        with:
          name: spring-server-jars
          path: integration_tests
      - run: make ci-no-generate

  integration-tests-typescript-server-real:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_integration_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make ci
